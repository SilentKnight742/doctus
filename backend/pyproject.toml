[project]
name = "doctus"
version = "0.2.0"
description = "A tutor chat that grows an evidence-checked concept graph of what you covered."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doctus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
filterwarnings = [
    # google-genai's generated types.py has invalid escapes in docstrings (Python 3.12+).
    "ignore:\"\\\\/\" is an invalid escape sequence:SyntaxWarning",
    # ...and the same issue as reported by Python 3.11.
    "ignore:invalid escape sequence:DeprecationWarning",
]
markers = [
    "live: calls the real Gemini API (needs GEMINI_API_KEY; run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
